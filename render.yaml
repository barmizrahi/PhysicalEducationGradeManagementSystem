services:
  # PostgreSQL Database
  - type: pserv
    name: pe-grades-db
    env: docker
    plan: free
    region: frankfurt
    ipAllowList: []

  # Backend Spring Boot Application
  - type: web
    name: pe-grades-backend
    env: java
    plan: free
    region: frankfurt
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/grade-management-system-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pe-grades-db
          property: connectionString
      - key: SPRING_DATASOURCE_URL
        value: ${DATABASE_URL}
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: LOG_LEVEL
        value: INFO

  # Frontend React Application
  - type: web
    name: pe-grades-frontend
    env: static
    plan: free
    region: frankfurt
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pe-grades-backend.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_ENV
        value: production

