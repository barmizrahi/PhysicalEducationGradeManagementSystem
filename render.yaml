databases:
  # PostgreSQL Database
  - name: pe-grades-db
    databaseName: pe_grades
    user: postgrest
    plan: free
    region: frankfurt

services:
  # Backend Spring Boot Application
  - type: web
    name: pe-grades-backend
    runtime: java
    plan: free
    region: frankfurt
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/grade-management-system-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pe-grades-db
          property: connectionString
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: pe-grades-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: pe-grades-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: pe-grades-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: pe-grades-frontend
          property: host
      - key: LOG_LEVEL
        value: INFO

  # Frontend React Application
  - type: web
    name: pe-grades-frontend
    runtime: static
    plan: free
    region: frankfurt
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pe-grades-backend
          property: host
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_ENV
        value: production

