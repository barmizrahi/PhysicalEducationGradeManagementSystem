version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pe-grades-db
    environment:
      POSTGRES_DB: pe_grades
      POSTGRES_USER: pe_admin
      POSTGRES_PASSWORD: dev_password_change_in_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pe_admin -d pe_grades"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pe-grades-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pegrades.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: pe-grades-network
